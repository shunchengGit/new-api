name: Split deployment check

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'deploy/split/**'
      - 'Dockerfile'
      - 'VERSION'
      - 'go.mod'
      - 'go.sum'
      - '**/*.go'
      - 'router/**'
      - 'web/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'THIRD-PARTY-LICENSES.md'
      - '.github/workflows/split-deployment-check.yml'
  push:
    branches:
      - rc.21
    paths:
      - 'deploy/split/**'
      - 'Dockerfile'
      - 'VERSION'
      - 'go.mod'
      - 'go.sum'
      - '**/*.go'
      - 'router/**'
      - 'web/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'THIRD-PARTY-LICENSES.md'
      - '.github/workflows/split-deployment-check.yml'

jobs:
  static-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check shell syntax
        run: |
          find deploy/split/scripts deploy/split/tests -type f -name '*.sh' -print0 \
            | xargs -0 sh -n
      - name: Check route ownership
        run: |
          deploy/split/scripts/check-route-ownership.sh "$(pwd)"
          deploy/split/tests/check-route-ownership-fixture.sh
      - name: Check artifact and release rendering
        run: deploy/split/tests/release-rendering-fixture.sh
      - name: Check immutable Compose images
        run: deploy/split/tests/compose-images-fixture.sh
      - name: Check deployment preflight
        run: deploy/split/tests/verify-deployment-contract.sh

  route-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run container and host route contracts
        env:
          REQUIRE_RUNTIME: 'true'
        run: deploy/split/tests/route-contract.sh
      - name: Run host release candidate gate
        run: deploy/split/tests/verify-host-release-contract.sh

  split-builds:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        theme: [default, classic]
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Export and verify frontend artifact
        env:
          THEME: ${{ matrix.theme }}
          APP_VERSION: split-check
          VCS_REF: ${{ github.sha }}
        run: |
          docker buildx build \
            --file deploy/split/Dockerfile.frontend \
            --target frontend-artifact \
            --build-arg THEME="$THEME" \
            --build-arg APP_VERSION="$APP_VERSION" \
            --build-arg VCS_REF="$VCS_REF" \
            --cache-from "type=gha,scope=frontend-$THEME" \
            --cache-to "type=gha,mode=max,scope=frontend-$THEME" \
            --output "type=local,dest=artifact-$THEME" \
            .
          deploy/split/scripts/verify-artifact.sh "artifact-$THEME"
      - name: Build frontend runtime
        env:
          THEME: ${{ matrix.theme }}
          APP_VERSION: split-check
          VCS_REF: ${{ github.sha }}
        run: |
          docker buildx build \
            --file deploy/split/Dockerfile.frontend \
            --target frontend-runtime \
            --build-arg THEME="$THEME" \
            --build-arg APP_VERSION="$APP_VERSION" \
            --build-arg VCS_REF="$VCS_REF" \
            --cache-from "type=gha,scope=frontend-$THEME" \
            --cache-to "type=gha,mode=max,scope=frontend-$THEME" \
            --load \
            --tag "new-api-split-frontend-$THEME:check" \
            .
      - name: Smoke-test frontend runtime
        env:
          THEME: ${{ matrix.theme }}
        run: |
          name="split-frontend-$THEME-$GITHUB_RUN_ID"
          cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "$name" -p 127.0.0.1::8080 \
            --read-only \
            --tmpfs /tmp:rw,uid=101,gid=101 \
            --tmpfs /usr/share/nginx/html:rw,uid=101,gid=101 \
            -e PUBLIC_HOST=contract.test \
            -e EXTERNAL_SCHEME=https \
            -e BACKEND_SERVICE=127.0.0.1:3000 \
            -e LISTEN_PORT=8080 \
            "new-api-split-frontend-$THEME:check"
          port=$(docker port "$name" 8080/tcp | python3 -c 'import sys; print(sys.stdin.read().strip().rsplit(":", 1)[1])')
          for attempt in $(seq 1 300); do
            if curl --fail --silent --show-error -H 'Host: contract.test' "http://127.0.0.1:$port/build-info.json" 2>/dev/null \
              | grep -F "\"theme\":\"$THEME\"" >/dev/null; then
              exit 0
            fi
            sleep 0.1
          done
          docker logs "$name"
          exit 1
      - name: Reject invalid build identity
        run: |
          if docker buildx build --file deploy/split/Dockerfile.frontend --target frontend-artifact \
            --build-arg THEME=unsupported --build-arg APP_VERSION=split-check \
            --build-arg VCS_REF="${{ github.sha }}" .; then
            echo 'invalid theme unexpectedly built' >&2
            exit 1
          fi
          if docker buildx build --file deploy/split/Dockerfile.frontend --target frontend-artifact \
            --build-arg THEME="${{ matrix.theme }}" --build-arg APP_VERSION=split-check \
            --build-arg VCS_REF=short .; then
            echo 'invalid source revision unexpectedly built' >&2
            exit 1
          fi

  all-in-one-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build all-in-one image
        run: |
          docker buildx build \
            --file Dockerfile \
            --cache-from type=gha,scope=all-in-one \
            --cache-to type=gha,mode=max,scope=all-in-one \
            --load \
            --tag new-api-all-in-one:check \
            .
      - name: Smoke-test all-in-one runtime
        run: |
          name="new-api-all-in-one-$GITHUB_RUN_ID"
          cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "$name" -p 127.0.0.1::3000 new-api-all-in-one:check
          port=$(docker port "$name" 3000/tcp | python3 -c 'import sys; print(sys.stdin.read().strip().rsplit(":", 1)[1])')
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 2 "http://127.0.0.1:$port/api/status" \
              | grep -Eq '"success"[[:space:]]*:[[:space:]]*true'; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs "$name"
              exit 1
            fi
            sleep 0.1
          done
          curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:$port/dashboard" \
            | grep -Eqi '<!doctype html>|<div id="root"'

  backend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build backend-only image
        run: |
          docker buildx build \
            --file deploy/split/Dockerfile.backend \
            --build-arg APP_VERSION=split-check \
            --build-arg VCS_REF="${{ github.sha }}" \
            --cache-from type=gha,scope=backend \
            --cache-to type=gha,mode=max,scope=backend \
            --load \
            --tag new-api-split-backend:check \
            .
          test "$(docker image inspect new-api-split-backend:check \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = split-check
          test "$(docker image inspect new-api-split-backend:check \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "${{ github.sha }}"
      - name: Reject invalid backend identity
        run: |
          if docker buildx build --file deploy/split/Dockerfile.backend \
            --build-arg APP_VERSION=split-check --build-arg VCS_REF=short .; then
            echo 'invalid backend source revision unexpectedly built' >&2
            exit 1
          fi
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.1'
          cache: true
      - name: Run Go tests
        run: |
          mkdir -p web/default/dist web/classic/dist
          printf '%s\n' '<!doctype html>' > web/default/dist/index.html
          printf '%s\n' '<!doctype html>' > web/classic/dist/index.html
          go test ./...
